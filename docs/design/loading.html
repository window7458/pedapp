<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{background:#fff;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(180deg,#5D6BCB 0%,#6A6BC6 55%,#836FC0 100%)}
.ph::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 30% at 30% 30%,rgba(140,180,255,.35),transparent),radial-gradient(40% 30% at 75% 70%,rgba(200,140,230,.35),transparent);animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,-5%) rotate(8deg)}}
svg.fig{position:absolute;left:0;top:90px;width:390px;height:660px;opacity:0;filter:blur(24px);transform:scale(.94);transform-origin:50% 40%;animation:appear 1.6s .1s cubic-bezier(.22,1,.36,1) forwards,hue 5s 1.6s ease-in-out infinite alternate}
@keyframes appear{to{opacity:1;filter:blur(0);transform:none}}
@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(-18deg) saturate(1.1)}}
.phone{animation:glow 1.4s 1s ease-in-out infinite}
@keyframes glow{50%{fill:#FFB27E}}
.ripple{opacity:0;transform-box:fill-box;transform-origin:center;animation:rip 2.1s 1.1s ease-out infinite}
.r2{animation-delay:1.8s}.r3{animation-delay:2.5s}
@keyframes rip{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(5.5)}}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.10}
.name{position:absolute;left:0;right:0;bottom:118px;text-align:center;color:#fff;font-size:32px;font-weight:800;letter-spacing:-.03em;z-index:2;display:flex;justify-content:center}
.name span{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.tag{position:absolute;left:0;right:0;bottom:90px;text-align:center;color:rgba(255,255,255,.8);font-size:14px;z-index:2;opacity:0;animation:fade .8s 1.9s forwards}
@keyframes fade{to{opacity:1}}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>

 <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FE3B0"/><stop offset=".28" stop-color="#C8A6D6"/><stop offset=".55" stop-color="#F2A7A0"/><stop offset="1" stop-color="#FF7A45"/></linearGradient>
 <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9EE6A8"/><stop offset=".55" stop-color="#A6B6E8"/><stop offset="1" stop-color="#FF9466"/></linearGradient>
 <symbol id="mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g></symbol>

 <svg class="fig" id="fig" viewBox="0 0 390 660" style="height:660px">
  <defs>
   <mask id="sil" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="660"><g filter="url(#soft)" fill="#fff">
    <ellipse cx="208" cy="122" rx="50" ry="60" transform="rotate(12 208 122)"/>
    <path d="M176 176C150 190 126 216 118 262C108 332 102 450 92 660L330 660C322 450 316 330 302 256C294 214 264 188 234 178Z"/>

  <linearGradient id="fadeg" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#fff"/><stop offset=".92" stop-color="#000"/></linearGradient><mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="660"><rect width="390" height="660" fill="url(#fadeg)"/></mask>
  <g mask="url(#fade)"><g mask="url(#sil)"><g filter="url(#soft2)">

  <circle class="ripple r1" cx="138" cy="318" r="20" fill="none" stroke="#FFD2B8" stroke-width="2"/><circle class="ripple r2" cx="138" cy="318" r="20" fill="none" stroke="#FFD2B8" stroke-width="2"/><circle class="ripple r3" cx="138" cy="318" r="20" fill="none" stroke="#FFD2B8" stroke-width="2"/>
  <rect class="phone" x="122" y="290" width="32" height="56" rx="7" fill="#FF6A2A" transform="rotate(-22 138 318)" filter="url(#ph)"/>
 </svg>

</div><script>const n=document.getElementById('nm');[...'SayEye'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(1.2+i*.08)+'s';n.append(s)});</script></body></html>
