.agent{cursor:pointer}
#stage{position:absolute;right:18px;top:64px;width:96px;height:128px;border-radius:16px;overflow:hidden;background:#0b1220;z-index:4;box-shadow:0 8px 20px rgba(10,20,60,.25)}
#stage video,#stage img,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hasvideo .say{padding-right:104px}
#notice{position:relative;margin:10px 6px 0 0;padding:12px 14px;border-radius:16px;background:#FFF1F0;color:#C8283A;font-weight:700;font-size:14px;z-index:5}
.lower{position:relative;z-index:4;display:flex;flex-direction:column;gap:14px;padding:0 18px}
.start{position:relative;height:clamp(104px,15vh,128px);border-radius:24px;background:var(--sky);color:#fff;overflow:hidden;display:flex;align-items:center;padding:0 22px;text-align:left;
  transition:background .5s var(--ease),transform .25s var(--ease);box-shadow:0 10px 24px rgba(60,90,220,.22)}
.start:active{transform:scale(.98)}
.start .pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.24);padding:5px 11px;border-radius:99px}
.start h2{font-size:34px;font-weight:900;letter-spacing:-.04em;margin:8px 0 0;line-height:1}
.start small{display:block;font-size:13px;font-weight:600;opacity:.92;margin-top:8px}
.start .art{position:absolute;right:-4px;bottom:0;width:190px;height:100%;pointer-events:none}
.running .start{background:var(--blue)}
.caut .start{background:linear-gradient(120deg,#F5A623,#E08A00)}
.warn .start{background:linear-gradient(120deg,#F0503C,#C8283A)}
.armed .start,.armed.tile{box-shadow:0 0 0 4px rgba(43,91,255,.35)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tiles .tile{height:clamp(130px,24vh,216px)}
#sos{color:#C8283A}
:root[data-hc="1"] .start{background:#000;border:3px solid #FFD400;color:#FFD400}
@media (prefers-color-scheme:dark){:root:not([data-hc="1"]) .tile{color:#fff}}
</style>

<div class="app" id="app">
  <div class="agent" id="agent" role="button" tabindex="0" aria-label="방금 안내 다시 듣기"><div class="fx"><i class="a"></i><i class="b"></i><i class="c"></i></div></div>

  </section>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="설정과 도움말" tabindex="-1">
  <div class="grab" aria-hidden="true"></div>
  <h2>설정</h2>
  <input type="hidden" id="oSrc" value="phone">
  <label><span>항상 듣기<small>버튼 없이 "시작", "그만", "다시 말해줘", "도와줘"를 알아들어요</small></span><input type="checkbox" class="sw" id="oListen"></label>
  <label><span>위치 공유<small>보호자 화면 지도에 지금 위치를 보여 줘요</small></span><input type="checkbox" class="sw" id="oGps"></label>
  <label><span>터치 안내<small>한 번 누르면 이름을 읽고, 한 번 더 누르면 실행</small></span><input type="checkbox" class="sw" id="oGuide"></label>
  <label><span>효과음</span><input type="checkbox" class="sw" id="oBeep"></label>
  <label><span>진동</span><input type="checkbox" class="sw" id="oVib"></label>
  <label><span>상황 · 장면 설명<small>위험 물체 설명, 불꽃놀이 · 벚꽃길 같은 장면</small></span><input type="checkbox" class="sw" id="oScene"></label>
  <label><span>고대비 (검정/노랑)</span><input type="checkbox" class="sw" id="oHc"></label>
  <label><span>화면에 카메라 보이기</span><input type="checkbox" class="sw" id="oPrev"></label>
  <label><span>음성 속도</span><input type="range" id="oRate" min="0.7" max="1.6" step="0.1"></label>
  <label><span>음성 크기</span><input type="range" id="oVol" min="0.3" max="1" step="0.1"></label>
  <div class="row-set"><button class="btn primary" id="help">사용법 듣기</button><button class="btn" id="closeSheet">닫기</button></div>
  <div class="row-set"><a class="btn" href="/dev">개발자 화면</a><a class="btn" href="/guardian">보호자 화면</a></div>

<script src="splash.js"></script>
<script src="sensors.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const S = {ws:null, running:false, mode:'phone', stream:null, timer:null, rate:1.1, vol:1, guide:true, beep:true, vib:true, scene:true,
           hc:false, prev:true, listen:true, gps:true, dets:null, detsAt:0, wake:null, seen:false, lastWarns:[], wsOk:false,
           spokeReady:false, pi:0, t0:0, latest:'', flashT:null, geo:null, lastGeo:0, fps:0};

function load(){ try{ Object.assign(S, JSON.parse(localStorage.getItem('sayeye')||'{}')); }catch(e){} S.running=false; S.mode='phone'; }   /* 스마트폰 전용: 예전에 파이로 저장된 설정도 폰으로 */
function save(){ try{ localStorage.setItem('sayeye', JSON.stringify({rate:S.rate,vol:S.vol,guide:S.guide,beep:S.beep,vib:S.vib,scene:S.scene,hc:S.hc,prev:S.prev,
  mode:S.mode,seen:S.seen,listen:S.listen,gps:S.gps})); }catch(e){} }
function notice(t){ const n=$('#notice'); n.textContent=t||''; n.hidden=!t; }

/* ── 화면 문구 (위쪽 에이전트 영역) ── */
const esc = (t) => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function say3(lab, h, p){ $('#sayLab').textContent=lab; $('#sayH').innerHTML=h; $('#sayP').textContent=p||''; $('#sayP').hidden=!p; }
function minutes(){ return Math.max(1, Math.round((performance.now()-S.t0)/60000)); }
function calmView(){
  if(document.body.classList.contains('warn')||document.body.classList.contains('caut')) return;
  if(S.running) say3(`${minutes()}분째 함께 걷는 중`, '주변을<br>살피고 있어요', S.latest ? `방금: ${S.latest}` : '');
  else say3('SayEye', '안녕하세요,<br>준비됐어요', '"시작"이라고 말하거나 아래 버튼을 두 번 누르세요');
}
function flash(level, text){             // level: warn(멈추세요) | caut(피하세요)
  const parts = text.split(/(?<=[.?!])\s+/), act = parts.length>1 ? parts.slice(1).join(' ') : '';
  document.body.classList.remove('warn','caut'); void document.body.offsetWidth; document.body.classList.add(level);
  const head = esc((act || parts[0]).replace(/\.$/,'')).replace(/으로 /,'으로<br>');
  say3(level==='warn'?'위험':'주의', head, act ? parts[0] : '');
  setGo(); clearTimeout(S.flashT);
  S.flashT=setTimeout(()=>{ document.body.classList.remove('warn','caut'); setGo(); calmView(); }, level==='warn'?4000:3200);
}

/* ── 소리: 효과음 + 음성 (경고가 설명을 끊고, 급한 경고가 덜 급한 경고를 끊는다) ── */
let actx=null;
function beep(kind){
  if(!S.beep) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {3:[[880,.12],[880,.12],[880,.12]], 2:[[660,.14],[660,.14]], 1:[[440,.12]], listen:[[520,.1],[780,.1]], ok:[[600,.08]]}[kind]||[];
    let t=actx.currentTime;
    for(const [f,d] of seq){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type='sine';
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35*S.vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d+.06; }
  }catch(e){}
}
function vibrate(prio){ if(!S.vib || !navigator.vibrate) return; navigator.vibrate({3:[300,100,300,100,300],2:[200,100,200],1:[120]}[prio]||[80]); }

const speech = (() => {
  let q=[], cur=null, voice=null;
  const PRI={warn:0,ui:1,desc:2,scene:3}, TTL={warn:2500,ui:9000,desc:6500,scene:14000};
  const synth = window.speechSynthesis;
  function pickVoice(){ if(!synth) return; voice = synth.getVoices().find(v => (v.lang||'').toLowerCase().startsWith('ko')) || null; }
  if(synth){ synth.onvoiceschanged = pickVoice; pickVoice(); }
  function push(kind, text, prio){
    if(!synth) return;
    prio = prio||1; let wait=0;
    if(kind==='warn'){
      q = q.filter(i => i.kind==='warn' && (i.prio||1) >= prio);
      if(cur && (cur.kind!=='warn' || prio > (cur.prio||1))){ cur=null; synth.cancel(); wait=90; }
    }else if(kind==='ui' && cur && (cur.kind==='desc'||cur.kind==='scene')){ cur=null; synth.cancel(); wait=90; }
    q.push({kind,text,prio,at:performance.now()});
    setTimeout(pump, wait);
  }
  function pump(){
    if(cur) return;
    const now=performance.now();
    q = q.filter(i => now-i.at <= TTL[i.kind]);
    if(!q.length){ ears.resume(); return; }
    q.sort((a,b) => PRI[a.kind]-PRI[b.kind] || (b.prio||1)-(a.prio||1) || a.at-b.at);
    const it=q.shift(); cur=it;
    ears.pause();                                   // 내 목소리를 명령으로 알아듣지 않게, 말하는 동안은 듣기를 멈춘다
    const u=new SpeechSynthesisUtterance(it.text); u.lang='ko-KR'; if(voice) u.voice=voice; u.rate=S.rate; u.volume=S.vol;
    const done=()=>{ if(cur===it){ cur=null; setTimeout(pump,60); } };
    u.onend=done; u.onerror=done;
    synth.speak(u);
  }
  function unlock(){ if(!synth) return; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; synth.speak(u); }catch(e){} }
  function stop(){ q=[]; cur=null; if(synth) synth.cancel(); }
  return {push, unlock, stop, busy:()=>!!cur};
})();
const say = (text, kind='ui', prio) => { speech.push(kind, text, prio); };

/* ── 항상 듣기: 버튼 없이 음성 명령 (말하는 중엔 잠시 멈춤) ── */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
const ears = (() => {
  let rec=null, on=false, paused=false, retry=null, denied=false;
  function label(t, live){ $('#earText').textContent=t; $('#ear').classList.toggle('listening', !!live); }
  function start(){
    if(!SR){ label('이 브라우저는 음성 명령을 못 써요'); return; }
    if(!S.listen || denied){ label(denied?'마이크 권한이 필요해요':'항상 듣기 꺼짐'); return; }
    if(on || paused) return;
    rec = new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=3;
    const fired=new Set();                          // 말이 끝나기 전에 이미 실행한 발화는 확정 결과에서 다시 실행하지 않는다
    rec.onresult = (e) => {
      for(let i=e.resultIndex;i<e.results.length;i++){ if(fired.has(i)) continue;
        const alts=[...e.results[i]].map(a=>a.transcript);
        if(e.results[i].isFinal) handleSpeech(alts);
        else if(handleQuick(alts)) fired.add(i); }
    };
    rec.onerror = (e) => { if(e.error==='not-allowed'||e.error==='service-not-allowed'){ denied=true; label('마이크 권한이 필요해요'); } };
    rec.onend = () => { on=false; if(!paused && S.listen && !denied){ clearTimeout(retry); retry=setTimeout(start, 400); } else if(!S.listen) label('항상 듣기 꺼짐'); };
    try{ rec.start(); on=true; label('듣고 있어요', true); }catch(e){ on=false; }
  }
  function pause(){ paused=true; if(on){ try{ rec.abort(); }catch(e){} on=false; } if(S.listen && !denied && SR) label('말하는 중'); }
  function resume(){ if(!paused) return; paused=false; clearTimeout(retry); retry=setTimeout(start, 250); }
  function stop(){ paused=false; clearTimeout(retry); if(on){ try{ rec.abort(); }catch(e){} on=false; } label(S.listen?'듣기 준비 중':'항상 듣기 꺼짐'); }
  return {start, pause, resume, stop};
})();
/* 확정 결과는 말이 끝난 뒤 침묵까지 기다려서 늦다. 시작·그만·도와줘만, 그 말 하나로 들리면 바로 실행한다. ("다시 시작"의 "다시"는 여기 안 걸림) */
const QUICK=[[/^(시작|시작해|시작해줘|출발)$/,'start'],[/^(그만|그만해|중지|정지|멈춰)$/,'stop'],[/^(도와줘|살려줘)$/,'sos']];
function handleQuick(alts){
  const raw=(alts[0]||'').replace(/\s+/g,'').replace(/[.,!?]/g,'').replace(/세이아이|쎄이아이|세이|sayeye|say/ig,'');
  const hit=QUICK.find(([re])=>re.test(raw));
  if(!hit) return false;
  beep('listen'); runCommand(hit[1]); return true;
}
function handleSpeech(alts){
  for(const t of alts){
    const raw=(t||'').replace(/\s+/g,'');
    const wake=/세이|쎄이|say/i.test(raw);
    if(!wake && raw.length>10) continue;            // 지나가는 대화를 명령으로 오해하지 않게: 짧은 말이거나 "세이아이"로 부를 때만
    const cmd=parseCommand(raw.replace(/세이아이|쎄이아이|세이|sayeye|say/ig,''));
    if(cmd){ beep('listen'); runCommand(cmd); return cmd; }
    if(wake){ say('네, 말씀하세요. 시작, 그만, 다시 말해줘, 도와줘라고 하면 돼요.'); return 'wake'; }
  }
  return null;
}
function parseCommand(text){
  const t = (text||'').replace(/\s+/g,'').toLowerCase();
  if(!t) return null;
  if(/(설명|장면|묘사).*(꺼|끄|그만|중지|멈)/.test(t)) return 'scene_off';
  if(/(설명|장면|묘사).*(켜|시작|해줘)/.test(t)) return 'scene_on';
  if(/(터치|안내모드|손가락).*(꺼|끄)/.test(t)) return 'guide_off';
  if(/(터치|안내모드|손가락).*(켜)/.test(t)) return 'guide_on';
  if(/도와|살려|구해|sos|긴급|보호자.*(불러|호출|연락|알려)|호출/.test(t)) return 'sos';
  if(/도움말|사용법|사용방법|설명서|명령어|뭘할|무엇을/.test(t)) return 'help';
  if(/다시시작/.test(t)) return 'start';
  if(/다시|뭐라|반복|방금|한번더/.test(t)) return 'repeat';
  if(/(소리|볼륨).*(크|키|높)/.test(t)) return 'vol_up';
  if(/(소리|볼륨).*(작|줄|낮)/.test(t)) return 'vol_down';
  if(/빠르|빨리/.test(t)) return 'faster';
  if(/느리|천천/.test(t)) return 'slower';
  if(/중지|정지|멈춰|그만|종료|끝내|꺼줘/.test(t)) return 'stop';
  if(/시작|출발|가자|실행|켜줘/.test(t)) return 'start';
  return null;
}
function runCommand(cmd){
  switch(cmd){
    case 'start': if(S.running) say('이미 안내 중이에요.'); else start(); break;
    case 'stop': if(S.running) stop(); else say('지금은 안내 중이 아니에요.'); break;
    case 'repeat': repeatLast(); break;
    case 'sos': sos(); break;
    case 'help': speakHelp(); break;
    case 'scene_on': S.scene=true; $('#oScene').checked=true; sendCmd({type:'set_scene',on:true}); save(); say('설명을 켰어요.'); break;
    case 'scene_off': S.scene=false; $('#oScene').checked=false; sendCmd({type:'set_scene',on:false}); save(); say('설명을 껐어요.'); break;
    case 'guide_on': S.guide=true; $('#oGuide').checked=true; save(); setGo(); say('터치 안내를 켰어요. 버튼을 한 번 누르면 이름을 읽고, 두 번 누르면 실행돼요.'); break;
    case 'guide_off': S.guide=false; $('#oGuide').checked=false; save(); setGo(); say('터치 안내를 껐어요. 이제 버튼을 한 번 누르면 바로 실행돼요.'); break;
    case 'vol_up': S.vol=Math.min(1,S.vol+.2); $('#oVol').value=S.vol; save(); say('소리를 키웠어요.'); break;
    case 'vol_down': S.vol=Math.max(.3,S.vol-.2); $('#oVol').value=S.vol; save(); say('소리를 줄였어요.'); break;
    case 'faster': S.rate=Math.min(1.6,S.rate+.2); $('#oRate').value=S.rate; save(); say('말을 빠르게 할게요.'); break;
    case 'slower': S.rate=Math.max(.7,S.rate-.2); $('#oRate').value=S.rate; save(); say('말을 천천히 할게요.'); break;
  }
}

/* ── 서버 연결 ── */
function connect(){
  const ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.binaryType='arraybuffer'; S.ws=ws;
  ws.onopen = () => { const was=S.wsOk===false && S.everOk; S.wsOk=true; S.everOk=true; setConn(true); sendCmd({type:'set_scene', on:S.scene});
                      if(S.running) sendCmd({type:'set_source', mode:S.mode});
                      if(was && S.running) say('서버와 다시 연결됐어요.'); };
  ws.onclose = () => { if(S.wsOk && S.running) say('서버와 연결이 끊겼어요. 다시 연결하는 중이에요.'); S.wsOk=false; setConn(false); setTimeout(connect, 1500); };
  ws.onmessage = (e) => { try{ handle(JSON.parse(e.data)); }catch(err){} };
}
function setConn(ok){ const c=$('#conn'); c.classList.toggle('off', !ok); c.lastChild.textContent = ok ? (S.running?'안내 중':'연결됨') : (S.everOk?'연결 끊김':'연결 중'); }
function sendCmd(o){ if(S.ws && S.ws.readyState===1) S.ws.send(JSON.stringify(o)); }
SayEyeSensors.start(o => { if(S.ws && S.ws.readyState===1){ S.ws.send(JSON.stringify(o)); return true; } return false; });

function handle(m){
  switch(m.type){
    case 'hello': S.pi=m.pi||0; $('#sysInfo').textContent=`인식 ${m.weights||m.perception} · 판단 ${m.trigger} · 설명 ${m.vlm==='none'?'꺼짐':'켜짐'}`; break;
    case 'camera': S.pi=m.connected||0; if(S.running && S.mode==='pi') say(S.pi ? '라즈베리파이 카메라가 연결됐어요.' : '라즈베리파이 카메라 연결이 끊겼어요.'); if(S.pi) notice(''); break;
    case 'dets': S.dets=m; S.detsAt=performance.now(); if(!S.spokeReady){ S.spokeReady=true; say('준비됐어요. 안내를 시작합니다.'); beep('ok'); } break;
    case 'warn': {
      const prio=m.prio||1;
      S.lastWarns.unshift(m.text); S.lastWarns.length=Math.min(S.lastWarns.length,5);
      beep(prio); vibrate(prio); speech.push('warn', m.text, prio);
      S.latest=m.text;
      if(prio>=3) flash('warn', m.text); else if(prio===2) flash('caut', m.text); else calmView();
      break; }
    case 'desc': if(S.scene){ S.latest=m.text; speech.push('desc', m.text); calmView(); } break;
    case 'scene': if(S.scene){ S.latest=m.text; speech.push('scene', m.text);
                    if(!document.body.classList.contains('warn') && !document.body.classList.contains('caut')) say3(m.label||'특별한 장면', '주변을<br>살피고 있어요', m.text); } break;
    case 'source': if(m.state==='error'){ notice(m.error); } else if(m.state==='ok' && S.mode!=='pi') notice(''); break;
    case 'status': S.fps=m.fps; S.rx=m.rx_fps; S.black=m.black; break;
  }
}

/* ── 카메라 ── */
async function start(){
  SayEyeSensors.askMotion();   /* 아이폰: 터치 안에서 바로 불러야 권한을 물어요 */
  notice(''); speech.unlock(); S.spokeReady=false;
  try{
    if(S.mode==='phone'){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const ios=/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent); if(ios){ say('아이폰에서는 크롬이 아니라 사파리로 열어야 카메라가 켜져요.'); notice('아이폰은 사파리로 열어 주세요. 크롬 · 파이어폭스는 카메라를 쓸 수 없어요.'); return; }
        say('카메라를 켤 수 없어요. 화면의 안내를 확인해 주세요.'); notice(`카메라를 쓸 수 없어요. 주소: ${location.protocol}//${location.host} · 보안 연결: ${window.isSecureContext?'예':'아니오'} · 브라우저: ${/KAKAOTALK|NAVER|Instagram|FB_IAB|; wv\)/i.test(navigator.userAgent)?'앱 안의 브라우저(크롬이나 사파리로 열어 주세요)':'일반'}`); return; }
      S.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
      const v=$('#cam'); v.srcObject=S.stream; await v.play(); v.hidden=false; $('#pv').hidden=true;
      sendCmd({type:'set_source', mode:'phone'}); startSending();
    }else{
      sendCmd({type:'set_source', mode:'pi'});
      if(!S.pi){ say('라즈베리파이 카메라가 아직 연결되지 않았어요. 파이에서 카메라 프로그램을 켜 주세요.'); notice('라즈베리파이 카메라가 연결되지 않았어요. 파이에서 pi_camera.py 를 실행해 주세요.'); }
      const im=$('#pv'); im.src='/preview.mjpg?'+Date.now(); im.hidden=false; $('#cam').hidden=true;
    }
  }catch(e){
    const denied = e && e.name==='NotAllowedError';
    say(denied ? '카메라 권한이 필요해요. 브라우저 설정에서 카메라를 허용해 주세요.' : '카메라를 켤 수 없어요.');
    notice(denied ? '카메라 권한이 필요해요.' : '카메라 오류: '+(e&&e.message||e)); return;
  }
  S.running=true; S.t0=performance.now(); S.latest=''; S.warnedNoVideo=false; setGo(); calmView(); save();
  say('안내를 시작합니다. 휴대폰을 세로로, 가슴 높이에서 앞을 향하게 들어 주세요.');
  try{ if(navigator.wakeLock) S.wake = await navigator.wakeLock.request('screen'); }catch(e){}
  startGeo();
}
function stop(){
  S.running=false; clearInterval(S.timer);
  if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; }
  $('#cam').hidden=true; $('#pv').hidden=true; $('#pv').removeAttribute('src');
  document.body.classList.remove('warn','caut'); setGo(); calmView();
  try{ if(S.wake){ S.wake.release(); S.wake=null; } }catch(e){}
  stopGeo();
  say('안내를 중지했어요.');
}
function setGo(){
  const b=$('#go'), body=document.body, lv=body.classList.contains('warn')?'DANGER':body.classList.contains('caut')?'CAUTION':'WATCHING';
  $('#goPill').textContent = S.running ? lv : 'START';
  $('#goTxt').textContent = S.running ? '중지' : '시작';
  $('#goSub').textContent = S.guide ? (S.running ? '두 번 누르면 안내를 멈춰요' : '두 번 누르면 안내가 시작돼요') : (S.running ? '누르면 안내를 멈춰요' : '누르면 안내가 시작돼요');
  b.setAttribute('aria-label', S.running?'중지':'시작');
  body.classList.toggle('running', S.running);
  const vid = S.running && S.prev; body.classList.toggle('hasvideo', vid); $('#stage').hidden=!vid;
  setConn(S.wsOk);
}
function startSending(){
  const c=document.createElement('canvas'), ctx=c.getContext('2d'); let busy=false; const v=$('#cam');
  S.timer=setInterval(()=>{
    if(!S.running || S.mode!=='phone' || busy || !S.ws || S.ws.readyState!==1 || S.ws.bufferedAmount>300000) return;
    const vw=v.videoWidth, vh=v.videoHeight; if(!vw) return;
    const s=Math.min(1, 960/Math.max(vw,vh)); c.width=Math.round(vw*s); c.height=Math.round(vh*s);
    ctx.drawImage(v,0,0,c.width,c.height); busy=true;
    c.toBlob(b=>{ busy=false; if(b) b.arrayBuffer().then(buf=>{ if(S.ws && S.ws.readyState===1) S.ws.send(buf); }); }, 'image/jpeg', 0.6);
  }, 100);
}
setInterval(()=>{ if(S.running && S.wsOk && performance.now()-S.t0>15000){
    const bad = S.rx>0 && S.black ? '카메라 영상이 까맣게 나와요. 화면을 켠 채 이 앱을 앞에 띄워 주시고, 렌즈가 가려졌는지 확인해 주세요.'
              : S.fps===0 && !S.rx ? '영상이 서버로 전달되지 않고 있어요.'
              : S.fps===0 ? '서버 처리가 늦어지고 있어요. 경고가 늦을 수 있어요.' : '';
    if(bad && !S.warnedNoVideo){ S.warnedNoVideo=true; say(bad); notice(bad); }
    if(!bad && S.warnedNoVideo){ S.warnedNoVideo=false; notice(''); }
  }
  if(S.running) calmView(); }, 5000);

/* ── 위치: 안내 중에만, 5초에 한 번 보호자에게 ── */
function startGeo(){
  if(!S.gps || !navigator.geolocation || S.geo!=null) return;
  S.geo = navigator.geolocation.watchPosition(p=>{
    const now=Date.now(); if(now-S.lastGeo<5000) return; S.lastGeo=now;
    sendCmd({type:'gps', lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy});
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function stopGeo(){ if(S.geo!=null){ navigator.geolocation.clearWatch(S.geo); S.geo=null; } }

/* ── 보호자 호출 · 배터리 ── */
function sos(){ sendCmd({type:'sos'}); beep(3); vibrate(3); say('보호자에게 도움을 요청했어요.'); }
if(navigator.getBattery) navigator.getBattery().then(b=>{
  let said=100; const chk=()=>{ const pct=Math.round(b.level*100);
    if(!b.charging && pct<=20 && pct<said-9){ said=pct; sendCmd({type:'client_event', kind:'battery', pct}); if(S.running) say(`배터리가 ${pct}퍼센트 남았어요.`); } };
  b.addEventListener('levelchange', chk); chk(); }).catch(()=>{});

function repeatLast(){ speech.unlock(); if(!S.lastWarns.length){ say(S.latest || '아직 들려드린 안내가 없어요.'); return; } say(S.lastWarns[0]); }
function speakHelp(){
  say('세이아이 사용법이에요. 화면 아래 큰 버튼이 시작과 중지예요. 그 아래 왼쪽은 다시 듣기, 오른쪽은 보호자 호출이에요. 화면 위쪽 아무 데나 눌러도 방금 안내를 다시 들려드려요. 버튼 없이 시작, 그만, 다시 말해줘, 도와줘, 소리 키워, 천천히라고 말해도 돼요. 주변이 시끄러우면 세이아이, 하고 부른 뒤 말해 주세요. 스크린리더를 쓰면 설정에서 터치 안내를 꺼 주세요.');
}

/* ── 터치 안내: 한 번 누르면 이름을 읽고, 4초 안에 같은 버튼을 한 번 더 누르면 실행 ── */
const GUIDE = { go:()=>S.running ? ['중지','안내를 멈춥니다.'] : ['시작','카메라로 주변을 보고 위험을 알려드립니다.'],
                sos:()=>['보호자 호출','보호자에게 도움 요청 알림을 보냅니다.'] };
const ACT = {go:()=>S.running?stop():start(), sos:sos, repeat:repeatLast};
const DIRECT = new Set(['repeat']);
let lastTap={id:null,t:0};
for(const id of Object.keys(ACT)){
  $('#'+id).addEventListener('click', (e)=>{
    e.stopPropagation(); firstTouch();
    if(!S.guide || DIRECT.has(id)){ ACT[id](); return; }
    const now=performance.now(), [name,desc]=GUIDE[id]();
    document.querySelectorAll('.armed').forEach(x=>x.classList.remove('armed'));
    if(lastTap.id===id && now-lastTap.t<4000){ lastTap={id:null,t:0}; ACT[id](); }
    else{ lastTap={id,t:now}; (id==='go'?$('.lower'):$('#'+id)).classList.add('armed'); setTimeout(()=>document.querySelectorAll('.armed').forEach(x=>x.classList.remove('armed')),4000);
          speech.unlock(); say(`${name}. ${desc} 실행하려면 같은 버튼을 한 번 더 누르세요.`); }
  });
}
$('#agent').addEventListener('click', ()=>{ firstTouch(); repeatLast(); });
$('.upper').addEventListener('click', (e)=>{ if(e.target.closest('button,a,select,input,#stage')) return; firstTouch(); repeatLast(); });
$('#agent').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); repeatLast(); } });
function firstTouch(){ if(!S.seen){ S.seen=true; save(); } speech.unlock(); ears.start(); }
document.addEventListener('pointerdown', ()=>{ ears.start(); }, {once:true});

/* ── 설정 ── */
function applySettings(){
  $('#oGuide').checked=S.guide; $('#oBeep').checked=S.beep; $('#oVib').checked=S.vib; $('#oScene').checked=S.scene; $('#oHc').checked=S.hc;
  $('#oPrev').checked=S.prev; $('#oRate').value=S.rate; $('#oVol').value=S.vol; $('#oSrc').value=S.mode; $('#oListen').checked=S.listen; $('#oGps').checked=S.gps;
  document.documentElement.dataset.hc = S.hc?'1':'';
  setGo();
}
const bind=(id,key,conv=(v)=>v)=>{ $('#'+id).addEventListener('input',e=>{ S[key]=conv(e.target.type==='checkbox'?e.target.checked:e.target.value); save(); applySettings();
  if(key==='scene') sendCmd({type:'set_scene',on:S.scene});
  if(key==='listen'){ S.listen ? ears.start() : ears.stop(); }
  if(key==='gps'){ S.gps && S.running ? startGeo() : stopGeo(); } }); };
bind('oGuide','guide'); bind('oBeep','beep'); bind('oVib','vib'); bind('oScene','scene'); bind('oHc','hc'); bind('oPrev','prev'); bind('oRate','rate',Number); bind('oVol','vol',Number);
bind('oListen','listen'); bind('oGps','gps');
$('#oSrc').addEventListener('input',e=>{ if(S.running) stop(); S.mode=e.target.value; save(); applySettings();
  say(S.mode==='pi' ? '카메라를 라즈베리파이로 바꿨어요.' : '카메라를 폰 카메라로 바꿨어요.'); });
$('#help').addEventListener('click', ()=>{ speech.unlock(); speakHelp(); });

/* ── 미리보기 위 인식 박스 ── */
const ov=$('#ov'), octx=ov.getContext('2d');
function draw(){
  const r=ov.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(r.width && ov.width!==Math.round(r.width*dpr)){ ov.width=Math.round(r.width*dpr); ov.height=Math.round(r.height*dpr); }
  octx.setTransform(dpr,0,0,dpr,0,0); octx.clearRect(0,0,r.width,r.height);
  if(S.running && S.prev && S.dets && performance.now()-S.detsAt<Math.max(700,S.fps>0?2500/S.fps:2500)){
    const v=$('#cam'), im=$('#pv'); const sw=(!v.hidden&&v.videoWidth)||(!im.hidden&&im.naturalWidth)||0, sh=(!v.hidden&&v.videoHeight)||(!im.hidden&&im.naturalHeight)||0;
    let k=1, ox=0, oy=0, fw=r.width, fh=r.height;
    if(sw&&sh){ k=Math.max(r.width/sw, r.height/sh); fw=sw*k; fh=sh*k; ox=(r.width-fw)/2; oy=(r.height-fh)/2; }
    octx.lineWidth=2; octx.strokeStyle='rgba(255,255,255,.95)';
    for(const [id,cls,x1,y1,x2,y2] of S.dets.d){ octx.beginPath(); octx.roundRect(ox+x1*fw,oy+y1*fh,(x2-x1)*fw,(y2-y1)*fh,5); octx.stroke(); }
  }
  requestAnimationFrame(draw);
}

load(); applySettings(); calmView(); connect(); requestAnimationFrame(draw);
window.__insight = {parseCommand, S, handleSpeech, flash, handle};

/* ── 설정 시트 ── */
const sheet=$('#sheet'), sheetBg=$('#sheetBg'); let sheetFrom=null;
function openSheet(on){ sheet.classList.toggle('open',on); sheetBg.classList.toggle('open',on); sheet.setAttribute('aria-hidden',!on);
  if(on){ sheetFrom=document.activeElement; setTimeout(()=>sheet.focus(),50); say('설정이에요. 아래로 내리거나 닫기를 누르면 돌아가요.'); } else if(sheetFrom){ sheetFrom.focus(); } }
$('#openSheet').onclick=(e)=>{ e.stopPropagation(); openSheet(true); }; $('#closeSheet').onclick=()=>openSheet(false); sheetBg.onclick=()=>openSheet(false);
addEventListener('keydown',e=>{ if(e.key==='Escape') openSheet(false); });
(()=>{ let y0=null; sheet.addEventListener('touchstart',e=>{ if(sheet.scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  sheet.addEventListener('touchmove',e=>{ if(y0!==null){ const d=e.touches[0].clientY-y0; if(d>0){ sheet.style.transition='none'; sheet.style.transform=`translateY(${d}px)`; } } },{passive:true});
  sheet.addEventListener('touchend',e=>{ if(y0===null) return; const d=e.changedTouches[0].clientY-y0; sheet.style.transition=''; sheet.style.transform=''; y0=null; if(d>90) openSheet(false); }); })();
</script>
</body>
