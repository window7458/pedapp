<style>
.hero{position:relative;flex:1;min-height:0;margin:10px 0 0;border-radius:32px;overflow:hidden;background:linear-gradient(160deg,#DDE7FB 0%,#C4D3F7 100%);box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){:root:not([data-hc="1"]) .hero{background:linear-gradient(160deg,#16213D,#0F1830)}}
:root[data-hc="1"] .hero{background:#000;border:3px solid #FFD400}
.idle{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .5s var(--ease)}
.idle i{position:absolute;border-radius:50%;border:1.5px solid var(--accent);opacity:.18;width:34%;aspect-ratio:1}
.idle i:nth-child(2){width:58%}.idle i:nth-child(3){width:82%}
.idle svg{width:30%;max-width:120px;opacity:.9;filter:drop-shadow(0 8px 20px rgba(39,68,158,.25))}
.running .idle i{animation:ring 3s var(--ease) infinite}.running .idle i:nth-child(2){animation-delay:.5s}.running .idle i:nth-child(3){animation-delay:1s}
@keyframes ring{0%{transform:scale(.7);opacity:.35}100%{transform:scale(1.25);opacity:0}}
#stage{position:absolute;inset:0;background:#0b1220}
#stage video,#stage img,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(10,16,32,.55));pointer-events:none;opacity:0;transition:opacity .5s}
.running.hasvideo .hero::after{opacity:1}
.chip{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;font-weight:700;color:#1B2F6B;z-index:3}
.chip b{width:9px;height:9px;border-radius:50%;background:#9AA8C6;transition:background .3s}
.running .chip b{background:#2F9E78;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(47,158,120,.2)}}
#live{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;padding:14px 16px;border-radius:24px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#12203A;box-shadow:0 8px 28px rgba(10,16,32,.18);display:flex;align-items:center;gap:12px;transition:background .3s,transform .3s var(--ease)}
@media (prefers-color-scheme:dark){:root:not([data-hc="1"]) #live{background:rgba(18,26,46,.9);color:#E8EEFB}}
:root[data-hc="1"] #live{background:#000;color:#FFD400;border:2px solid #FFD400}
#live .t{flex:1;min-width:0}#liveText{display:block;font-size:19px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
#liveMeta{display:block;font-size:12px;font-weight:600;color:var(--accent);margin-top:2px}#liveMeta:empty{display:none}
#live.warn{background:var(--danger-tint)}
#repeat{flex:none;width:48px;height:48px;border-radius:16px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
#repeat svg{width:22px;height:22px}
#notice{position:absolute;top:12px;left:12px;right:12px;z-index:5;margin:0;padding:12px 16px;border-radius:18px;background:var(--danger-tint);color:var(--danger);font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.dock{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:18px 4px 6px}
.side{display:grid;justify-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.side button{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--accent);transition:transform .25s var(--ease),background .3s,color .3s}
.side button:active{transform:scale(.9)}.side svg{width:28px;height:28px}
:root[data-hc="1"] .side button{border:3px solid #FFD400}
#mic.on{background:var(--accent);color:var(--on-accent);animation:listen 1.2s ease-in-out infinite}
@keyframes listen{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 22%,transparent)}}
#sos{color:var(--danger)}#sos:active{background:var(--danger-tint)}
button.big{position:relative;width:118px;height:118px;border-radius:50%;background:linear-gradient(145deg,var(--accent2),var(--accent) 55%,#2B4DB8);color:#fff;display:grid;place-items:center;box-shadow:0 16px 36px rgba(61,104,224,.38),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s var(--ease),box-shadow .4s,background .4s}
button.big:active{transform:scale(.94)}
button.big svg{width:44px;height:44px;grid-area:1/1;transition:opacity .25s,transform .4s var(--ease)}
button.big .i-stop{opacity:0;transform:scale(.4) rotate(-45deg)}
button.big.running{background:linear-gradient(145deg,#F7A099,var(--danger) 60%,#B93A33);box-shadow:0 16px 36px rgba(217,71,63,.35),inset 0 1px 0 rgba(255,255,255,.3)}
button.big.running .i-play{opacity:0;transform:scale(.4) rotate(45deg)}button.big.running .i-stop{opacity:1;transform:none}
button.big::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);opacity:.0}
button.big.running::before{border-color:var(--danger);animation:ring2 2.2s var(--ease) infinite}
@keyframes ring2{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.28);opacity:0}}
:root[data-hc="1"] button.big{background:#FFD400;color:#000;box-shadow:none}
.gotxt{display:block;text-align:center;margin-top:8px;font-weight:800;font-size:15px;letter-spacing:-.03em}
.center{display:grid;justify-items:center}
</style>

<div id="splash" aria-hidden="true"><div class="stack"><div style="position:relative;display:grid;place-items:center"><i class="glow"></i>
<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path class="eye" pathLength="140" d="M6 32c6-10 14-15 24-15s17 5 22 15c-5 10-13 15-22 15S12 42 6 32z" stroke-width="3" transform="translate(-4 0)"/><circle class="iris" cx="28" cy="32" r="7" fill="#fff" stroke="none"/><circle class="pupil" cx="28" cy="32" r="2.8" fill="#27449E" stroke="none"/>
<path class="w w1" pathLength="30" d="M46 26c3 4 3 8 0 12" stroke-width="2.8"/><path class="w w2" pathLength="30" d="M51 22c5 6 5 14 0 20" stroke-width="2.8"/><path class="w w3" pathLength="30" d="M56 18c7 8 7 20 0 28" stroke-width="2.8"/></svg></div>
<div class="name" id="splashName"></div><div class="tag">말하고, 보고, 함께 걸어요</div></div></div>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="url(#lg)"/><path d="M6 32c6-10 14-15 24-15s17 5 22 15c-5 10-13 15-22 15S12 42 6 32z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" transform="translate(-2 0)"/><circle cx="28" cy="32" r="6.5" fill="#fff"/><circle cx="28" cy="32" r="2.6" fill="#27449E"/><path d="M50 24c3 5 3 11 0 16M56 20c5 7 5 17 0 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/></svg><span>SayEye</span></div>

  <section class="hero" id="heroBox">

    <div class="idle" aria-hidden="true"><i></i><i></i><i></i>
      <svg viewBox="0 0 64 64" fill="none" stroke="#27449E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 32c6-10 14-15 24-15s17 5 22 15c-5 10-13 15-22 15S10 42 4 32z"/><circle cx="26" cy="32" r="6.5" fill="#27449E"/><path d="M48 25c3 4 3 10 0 14M54 21c5 7 5 15 0 22" opacity=".7"/></svg></div>
    <div id="stage" aria-hidden="true" hidden><video id="cam" playsinline muted hidden></video><img id="pv" alt="" hidden><canvas id="ov"></canvas></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="설정과 도움말" tabindex="-1">

  <h2>설정</h2>
  <label><span>터치 안내<small>한 번 누르면 이름을 읽고, 한 번 더 누르면 실행</small></span><input type="checkbox" class="sw" id="oGuide"></label>
  <label><span>효과음</span><input type="checkbox" class="sw" id="oBeep"></label>

  <label><span>장면 설명<small>불꽃놀이·벚꽃길 같은 특별한 장면</small></span><input type="checkbox" class="sw" id="oScene"></label>
  <label><span>고대비 (검정/노랑)</span><input type="checkbox" class="sw" id="oHc"></label>

  <p style="margin:6px 2px 0;font-size:13px;color:var(--muted)"><a href="/guardian">보호자 화면</a> · <a href="/dev">개발 화면</a></p>

<script>
const $ = (s) => document.querySelector(s);
const KO = {person:'사람',bicycle:'자전거',scooter:'킥보드',motorcycle:'오토바이',car:'자동차',bus:'버스',other_vehicle:'차량',obstacle:'장애물',stairs:'계단',traffic_light:'신호등'};
const S = {ws:null, running:false, mode:'phone', stream:null, timer:null, rate:1.1, vol:1, guide:true, beep:true, vib:true, scene:true,
           hc:false, prev:true, dets:null, detsAt:0, wake:null, defaultUrl:'', seen:false, ready:false, lastWarns:[], wsOk:false, lastMsgAt:0,
           spokeReady:false};

function load(){ try{ Object.assign(S, JSON.parse(localStorage.getItem('insight2')||'{}')); }catch(e){} }
function save(){ try{ localStorage.setItem('insight2', JSON.stringify({rate:S.rate,vol:S.vol,guide:S.guide,beep:S.beep,vib:S.vib,scene:S.scene,hc:S.hc,prev:S.prev,mode:S.mode,seen:S.seen,url:$('#url').value})); }catch(e){} }
function notice(t){ const n=$('#notice'); n.textContent=t||''; n.hidden=!t; }
function live(text, meta){ $('#liveText').textContent=text; $('#liveMeta').textContent=meta||''; $('#live').classList.toggle('warn', meta==='경고'); }

/* ── 소리: 효과음 + 음성 (경고가 설명·장면을 끊고, 급한 경고가 덜 급한 경고를 끊는다) ── */
let actx=null;
function beep(kind){
  if(!S.beep) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {3:[[880,.12],[880,.12],[880,.12]], 2:[[660,.14],[660,.14]], 1:[[440,.12]], listen:[[520,.1],[780,.1]], ok:[[600,.08]]}[kind]||[];
    let t=actx.currentTime;
    for(const [f,d] of seq){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type='sine';
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35*S.vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d+.06; }
  }catch(e){}
}
function vibrate(prio){ if(!S.vib || !navigator.vibrate) return; navigator.vibrate({3:[300,100,300,100,300],2:[200,100,200],1:[120]}[prio]||[80]); }

const speech = (() => {
  let q=[], cur=null, voice=null;
  const PRI={warn:0,ui:1,desc:2,scene:3}, TTL={warn:2500,ui:9000,desc:6500,scene:14000};
  const synth = window.speechSynthesis;
  function pickVoice(){ if(!synth) return; voice = synth.getVoices().find(v => (v.lang||'').toLowerCase().startsWith('ko')) || null; }
  if(synth){ synth.onvoiceschanged = pickVoice; pickVoice(); }
  function push(kind, text, prio){
    if(!synth) return;
    prio = prio||1; let wait=0;
    if(kind==='warn'){
      q = q.filter(i => i.kind==='warn' && (i.prio||1) >= prio);
      if(cur && (cur.kind!=='warn' || prio > (cur.prio||1))){ cur=null; synth.cancel(); wait=90; }
    }else if(kind==='ui' && cur && (cur.kind==='desc'||cur.kind==='scene')){ cur=null; synth.cancel(); wait=90; }
    q.push({kind,text,prio,at:performance.now()});
    setTimeout(pump, wait);
  }
  function pump(){
    if(cur) return;
    const now=performance.now();
    q = q.filter(i => now-i.at <= TTL[i.kind]);
    if(!q.length) return;
    q.sort((a,b) => PRI[a.kind]-PRI[b.kind] || (b.prio||1)-(a.prio||1) || a.at-b.at);
    const it=q.shift(); cur=it;
    const u=new SpeechSynthesisUtterance(it.text); u.lang='ko-KR'; if(voice) u.voice=voice; u.rate=S.rate; u.volume=S.vol;
    const done=()=>{ if(cur===it){ cur=null; setTimeout(pump,60); } };
    u.onend=done; u.onerror=done;
    synth.speak(u);
  }
  function unlock(){ if(!synth) return; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; synth.speak(u); }catch(e){} }
  function stop(){ q=[]; cur=null; if(synth) synth.cancel(); }
  return {push, unlock, stop};
})();
const say = (text, kind='ui', prio) => { live(text); speech.push(kind, text, prio); };

/* ── 연결 ── */
function connect(){
  const ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.binaryType='arraybuffer'; S.ws=ws;
  ws.onopen = () => { const was=S.wsOk===false && S.everOk; S.wsOk=true; S.everOk=true; $('#conn').textContent='연결됨'; $('#conn').classList.remove('off'); sendCmd({type:'set_scene', on:S.scene});
                      if(was && S.running) say('서버와 다시 연결됐어요.'); };
  ws.onclose = () => { if(S.wsOk && S.running) say('서버와 연결이 끊겼어요. 다시 연결하는 중이에요.', 'ui'); S.wsOk=false; $('#conn').textContent='연결 끊김'; $('#conn').classList.add('off'); setTimeout(connect, 1500); };
  ws.onmessage = (e) => { S.lastMsgAt=performance.now(); try{ handle(JSON.parse(e.data)); }catch(err){} };
}
function sendCmd(o){ if(S.ws && S.ws.readyState===1) S.ws.send(JSON.stringify(o)); }

function handle(m){
  switch(m.type){
    case 'hello': S.defaultUrl = m.default_url||''; if(S.defaultUrl && !$('#url').value) $('#url').value=S.defaultUrl; break;
    case 'dets': S.dets=m; S.detsAt=performance.now(); if(!S.spokeReady){ S.spokeReady=true; say('준비됐어요. 안내를 시작합니다.'); beep('ok'); } break;
    case 'warn':
      if(listening) try{ rec.abort(); }catch(e){}
      S.lastWarns.unshift(m.text); S.lastWarns.length=Math.min(S.lastWarns.length,5);
      beep(m.prio||1); vibrate(m.prio||1);
      live(m.text, '경고'); speech.push('warn', m.text, m.prio);
      break;
    case 'desc': live(m.text,'설명'); speech.push('desc', m.text); break;
    case 'scene': if(S.scene){ live(m.text, m.label||'특별한 장면'); speech.push('scene', m.text); } break;
    case 'source': if(m.state==='error'){ notice(m.error); say('서버 카메라에 연결하지 못했어요.'); } else if(m.state==='ok') notice(''); break;
    case 'status': S.fps=m.fps; break;
  }
}

/* ── 카메라 ── */
async function start(){
  notice(''); speech.unlock(); S.spokeReady=false;
  try{
    if(S.mode==='phone'){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const ios=/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent); if(ios){ say('아이폰에서는 크롬이 아니라 사파리로 열어야 카메라가 켜져요.'); notice('아이폰은 사파리로 열어 주세요. 크롬·파이어폭스는 카메라를 쓸 수 없어요.'); return; }
      say('카메라를 켤 수 없어요. 화면의 안내를 확인해 주세요.'); notice(`카메라를 쓸 수 없어요. 주소: ${location.protocol}//${location.host} · 보안 연결: ${window.isSecureContext?'예':'아니오'} · 브라우저: ${/KAKAOTALK|NAVER|Instagram|FB_IAB|; wv\)/i.test(navigator.userAgent)?'앱 안의 브라우저(크롬이나 사파리로 열어 주세요)':'일반'}`); return; }
      S.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
      const v=$('#cam'); v.srcObject=S.stream; await v.play(); v.hidden=!S.prev; $('#pv').hidden=true;
      sendCmd({type:'set_source', mode:'phone'}); startSending();
    }else{
      const url=$('#url').value.trim();
      if(!url){ say('서버 카메라 주소가 비어 있어요. 설정에서 입력해 주세요.'); return; }
      sendCmd({type:'set_source', mode:'url', url});
      const im=$('#pv'); im.src='/preview.mjpg?'+Date.now(); im.hidden=!S.prev; $('#cam').hidden=true;
    }
  }catch(e){
    const denied = e && e.name==='NotAllowedError';
    say(denied ? '카메라 권한이 필요해요. 브라우저 설정에서 카메라를 허용해 주세요.' : '카메라를 켤 수 없어요.');
    notice(denied ? '카메라 권한이 필요해요.' : '카메라 오류: '+(e&&e.message||e)); return;
  }
  S.running=true; S.t0=performance.now(); S.warnedNoVideo=false; setGo(); save();
  say('안내를 시작합니다. 휴대폰을 세로로, 가슴 높이에서 앞을 향하게 들어 주세요.');
  try{ if(navigator.wakeLock) S.wake = await navigator.wakeLock.request('screen'); }catch(e){}
}
function stop(){
  S.running=false; clearInterval(S.timer);
  if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; }
  $('#cam').hidden=true; $('#pv').hidden=true; $('#pv').removeAttribute('src'); setGo();
  try{ if(S.wake){ S.wake.release(); S.wake=null; } }catch(e){}
  say('안내를 중지했어요.');
}
function setGo(){ const b=$('#go'); $('#goTxt').textContent=S.running?'중지':'시작'; b.setAttribute('aria-label', S.running?'중지':'시작'); b.classList.toggle('running', S.running);
  document.body.classList.toggle('running', S.running); document.body.classList.toggle('hasvideo', S.running && S.prev); $('#stage').hidden=!(S.running && S.prev);
  $('#chipText').textContent = S.running ? '주변을 살피는 중' : '준비됐어요'; }
function startSending(){
  const c=document.createElement('canvas'), ctx=c.getContext('2d'); let busy=false; const v=$('#cam');
  S.timer=setInterval(()=>{
    if(!S.running || S.mode!=='phone' || busy || !S.ws || S.ws.readyState!==1 || S.ws.bufferedAmount>300000) return;
    const vw=v.videoWidth, vh=v.videoHeight; if(!vw) return;
    const s=Math.min(1, 960/Math.max(vw,vh)); c.width=Math.round(vw*s); c.height=Math.round(vh*s);
    ctx.drawImage(v,0,0,c.width,c.height); busy=true;
    c.toBlob(b=>{ busy=false; if(b) b.arrayBuffer().then(buf=>{ if(S.ws && S.ws.readyState===1) S.ws.send(buf); }); }, 'image/jpeg', 0.6);
  }, 100);
}
/* 영상이 서버에 안 닿는 걸 알려 준다 */
setInterval(()=>{ if(S.running && S.wsOk && S.mode==='phone' && S.fps===0 && !S.warnedNoVideo && performance.now()-S.t0>15000){ S.warnedNoVideo=true; say('영상이 서버로 전달되지 않고 있어요.'); }
                  if(S.fps>0) S.warnedNoVideo=false; }, 4000);

/* ── 보호자 호출 · 배터리 ── */
function sos(){ sendCmd({type:'sos'}); beep(3); vibrate(3); say('보호자에게 도움을 요청했어요.'); }
if(navigator.getBattery) navigator.getBattery().then(b=>{
  let said=100; const chk=()=>{ const pct=Math.round(b.level*100);
    if(!b.charging && pct<=20 && pct<said-9){ said=pct; sendCmd({type:'client_event', kind:'battery', pct}); if(S.running) say(`배터리가 ${pct}퍼센트 남았어요.`); } };
  b.addEventListener('levelchange', chk); chk(); }).catch(()=>{});

/* ── 음성 명령 (누르고 말하기) ── */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false;
function parseCommand(text){
  const t = (text||'').replace(/\s+/g,'').toLowerCase();
  if(/(설명|장면|묘사).*(꺼|끄|그만|중지|멈)/.test(t)) return 'scene_off';
  if(/(설명|장면|묘사).*(켜|시작|해줘)/.test(t)) return 'scene_on';
  if(/(터치|안내모드|손가락).*(꺼|끄)/.test(t)) return 'guide_off';
  if(/(터치|안내모드|손가락).*(켜)/.test(t)) return 'guide_on';
  if(/도와|살려|구해|sos|긴급|보호자.*(불러|호출|연락|알려)|호출/.test(t)) return 'sos';
  if(/도움말|사용법|사용방법|설명서|명령어|뭘할|무엇을/.test(t)) return 'help';
  if(/다시시작/.test(t)) return 'start';
  if(/다시|뭐라|반복|방금|한번더/.test(t)) return 'repeat';
  if(/(소리|볼륨).*(크|키|높)/.test(t)) return 'vol_up';
  if(/(소리|볼륨).*(작|줄|낮)/.test(t)) return 'vol_down';
  if(/빠르|빨리/.test(t)) return 'faster';
  if(/느리|천천/.test(t)) return 'slower';
  if(/중지|정지|멈춰|그만|종료|끝내|꺼줘|꺼/.test(t)) return 'stop';
  if(/시작|출발|켜|가자|실행/.test(t)) return 'start';
  return null;
}
function runCommand(cmd){
  switch(cmd){
    case 'start': if(S.running) say('이미 안내 중이에요.'); else start(); break;
    case 'stop': if(S.running) stop(); else say('지금은 안내 중이 아니에요.'); break;
    case 'repeat': repeatLast(); break;
    case 'sos': sos(); break;
    case 'help': speakHelp(); break;
    case 'scene_on': S.scene=true; $('#oScene').checked=true; sendCmd({type:'set_scene',on:true}); save(); say('장면 설명을 켰어요.'); break;
    case 'scene_off': S.scene=false; $('#oScene').checked=false; sendCmd({type:'set_scene',on:false}); save(); say('장면 설명을 껐어요.'); break;
    case 'guide_on': S.guide=true; $('#oGuide').checked=true; save(); say('터치 안내를 켰어요. 버튼을 한 번 누르면 이름을 읽고, 두 번 누르면 실행돼요.'); break;
    case 'guide_off': S.guide=false; $('#oGuide').checked=false; save(); say('터치 안내를 껐어요. 이제 버튼을 한 번 누르면 바로 실행돼요.'); break;
    case 'vol_up': S.vol=Math.min(1,S.vol+.2); $('#oVol').value=S.vol; save(); say('소리를 키웠어요.'); break;
    case 'vol_down': S.vol=Math.max(.3,S.vol-.2); $('#oVol').value=S.vol; save(); say('소리를 줄였어요.'); break;
    case 'faster': S.rate=Math.min(1.6,S.rate+.2); $('#oRate').value=S.rate; save(); say('말을 빠르게 할게요.'); break;
    case 'slower': S.rate=Math.max(.7,S.rate-.2); $('#oRate').value=S.rate; save(); say('말을 천천히 할게요.'); break;
    default: say('잘 못 들었어요. 도움말이라고 말해 보세요.');
  }
}
function listen(){
  if(!SR){ say('이 브라우저는 음성 명령을 지원하지 않아요. 버튼을 사용해 주세요.'); return; }
  if(listening){ try{ rec.stop(); }catch(e){} return; }
  speech.unlock(); beep('listen');
  rec = new SR(); rec.lang='ko-KR'; rec.interimResults=false; rec.maxAlternatives=3;
  let got=false;
  rec.onresult = (e)=>{ got=true; let cmd=null, heard='';
    for(const alt of e.results[0]){ heard = heard||alt.transcript; cmd = parseCommand(alt.transcript); if(cmd){ heard=alt.transcript; break; } }
    live(`"${heard}"`, '음성 명령'); runCommand(cmd); };
  rec.onerror = (e)=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed') say('마이크 권한이 필요해요. 브라우저 설정에서 허용해 주세요.'); else if(e.error==='no-speech') say('말씀이 들리지 않았어요.'); };
  rec.onend = ()=>{ listening=false; $('#mic').classList.remove('on'); clearTimeout(rec._t); };
  try{ rec.start(); listening=true; $('#mic').classList.add('on'); live('듣고 있어요. 말씀하세요.'); rec._t=setTimeout(()=>{ try{ rec.stop(); }catch(e){} }, 7000); }catch(e){ listening=false; }
}
function repeatLast(){
  if(!S.lastWarns.length){ say('아직 들려드린 안내가 없어요.'); return; }
  say(S.lastWarns[0]);
}
function speakHelp(){
  say('세이아이 사용법이에요. 화면 아래 가운데 큰 버튼은 시작과 중지예요. 왼쪽 버튼은 음성 명령이에요. 누르고 시작, 중지, 다시 들려줘, 도와줘, 소리 키워, 천천히, 설명 꺼줘 같은 말을 해 보세요. 도와줘라고 하거나 오른쪽 보호자 호출 버튼을 두 번 누르면 보호자에게 알림이 가요. 스크린리더를 쓰면 설정에서 터치 안내를 꺼 주세요.');
}

/* ── 터치 안내: 한 번 누르면 이름과 기능을 읽고, 4초 안에 같은 버튼을 한 번 더 누르면 실행 ── */
const GUIDE = {
  go:    ()=>S.running ? ['중지','안내를 멈춥니다.'] : ['시작','카메라로 주변을 보고 위험을 알려드립니다.'],
  mic:   ()=>['음성 명령','누르고 말씀하세요. 시작, 중지, 다시 들려줘, 도와줘 같은 말을 알아들어요.'],
  repeat:()=>['다시 듣기','방금 들려드린 안내를 한 번 더 읽어 드립니다.'],
  sos:   ()=>['보호자 호출','보호자에게 도움 요청 알림을 보냅니다.'],
};
const ACT = {go:()=>S.running?stop():start(), mic:listen, repeat:repeatLast, sos:sos};
const DIRECT = new Set(['mic','repeat']);          // 위험하지 않은 버튼은 한 번에 실행
let lastTap={id:null,t:0};
for(const id of Object.keys(ACT)){
  $('#'+id).addEventListener('click', ()=>{
    if(!S.seen) firstTouch();
    if(!S.guide || DIRECT.has(id)){ ACT[id](); return; }
    const now=performance.now(), [name,desc]=GUIDE[id]();
    if(lastTap.id===id && now-lastTap.t<4000){ lastTap={id:null,t:0}; ACT[id](); }
    else{ lastTap={id,t:now}; speech.unlock(); say(`${name}. ${desc} 실행하려면 같은 버튼을 한 번 더 누르세요.`); }
  });
}
function firstTouch(){
  S.seen=true; save(); speech.unlock();
}

/* ── 설정 ── */
function applySettings(){
  $('#oGuide').checked=S.guide; $('#oBeep').checked=S.beep; $('#oVib').checked=S.vib; $('#oScene').checked=S.scene; $('#oHc').checked=S.hc;
  $('#oPrev').checked=S.prev; $('#oRate').value=S.rate; $('#oVol').value=S.vol; $('#oSrc').value=S.mode; $('#urlBox').hidden=S.mode!=='server';
  document.documentElement.dataset.hc = S.hc?'1':'';
  setGo();
}
const bind=(id,key,conv=(v)=>v)=>{ $('#'+id).addEventListener('input',e=>{ S[key]=conv(e.target.type==='checkbox'?e.target.checked:e.target.value); save(); applySettings(); if(key==='scene') sendCmd({type:'set_scene',on:S.scene}); }); };
bind('oGuide','guide'); bind('oBeep','beep'); bind('oVib','vib'); bind('oScene','scene'); bind('oHc','hc'); bind('oPrev','prev'); bind('oRate','rate',Number); bind('oVol','vol',Number);
$('#oSrc').addEventListener('input',e=>{ S.mode=e.target.value; save(); applySettings(); if(S.running){ stop(); } });
$('#url').addEventListener('change', save);
$('#help').addEventListener('click', ()=>{ speech.unlock(); speakHelp(); });

/* ── 박스 (보조 화면) ── */
const ov=$('#ov'), octx=ov.getContext('2d');
function draw(){
  const r=ov.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(ov.width!==Math.round(r.width*dpr)){ ov.width=Math.round(r.width*dpr); ov.height=Math.round(r.height*dpr); }
  octx.setTransform(dpr,0,0,dpr,0,0); octx.clearRect(0,0,r.width,r.height);
  if(S.running && S.prev && S.dets && performance.now()-S.detsAt<Math.max(700,S.fps>0?2500/S.fps:2500)){
    const v=$('#cam'), im=$('#pv'); const sw=(!v.hidden&&v.videoWidth)||(!im.hidden&&im.naturalWidth)||0, sh=(!v.hidden&&v.videoHeight)||(!im.hidden&&im.naturalHeight)||0;
    let k=1, ox=0, oy=0, fw=r.width, fh=r.height;                     // object-fit:cover 로 잘린 만큼 좌표를 맞춘다
    if(sw&&sh){ k=Math.max(r.width/sw, r.height/sh); fw=sw*k; fh=sh*k; ox=(r.width-fw)/2; oy=(r.height-fh)/2; }
    octx.lineWidth=2.5; octx.strokeStyle='rgba(255,255,255,.95)'; octx.font='600 13px system-ui'; octx.fillStyle='#fff'; octx.shadowColor='rgba(0,0,0,.5)'; octx.shadowBlur=4;
    for(const [id,cls,x1,y1,x2,y2] of S.dets.d){ octx.beginPath(); octx.roundRect(ox+x1*fw,oy+y1*fh,(x2-x1)*fw,(y2-y1)*fh,8); octx.stroke(); octx.fillText(KO[cls]||cls, ox+x1*fw+6, oy+y1*fh+16); }
    octx.shadowBlur=0;
  }
  requestAnimationFrame(draw);
}

load(); applySettings(); connect(); requestAnimationFrame(draw);
window.__insight = {parseCommand, S};

/* ── 설정 시트 ── */
const sheet=$('#sheet'), sheetBg=$('#sheetBg'); let sheetFrom=null;
function openSheet(on){ sheet.classList.toggle('open',on); sheetBg.classList.toggle('open',on); sheet.setAttribute('aria-hidden',!on);
  if(on){ sheetFrom=document.activeElement; setTimeout(()=>sheet.focus(),50); say('설정이에요. 아래로 내리거나 닫기를 누르면 돌아가요.'); } else if(sheetFrom){ sheetFrom.focus(); } }
$('#openSheet').onclick=()=>openSheet(true); $('#closeSheet').onclick=()=>openSheet(false); sheetBg.onclick=()=>openSheet(false);
addEventListener('keydown',e=>{ if(e.key==='Escape') openSheet(false); });
(()=>{ let y0=null; sheet.addEventListener('touchstart',e=>{ if(sheet.scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  sheet.addEventListener('touchmove',e=>{ if(y0!==null){ const d=e.touches[0].clientY-y0; if(d>0){ sheet.style.transition='none'; sheet.style.transform=`translateY(${d}px)`; } } },{passive:true});
  sheet.addEventListener('touchend',e=>{ if(y0===null) return; const d=e.changedTouches[0].clientY-y0; sheet.style.transition=''; sheet.style.transform=''; y0=null; if(d>90) openSheet(false); }); })();

/* ── 시작 화면: 글자가 한 자씩 올라오고 눈이 그려진 뒤 부드럽게 사라짐 ── */
(()=>{ const n=$('#splashName'); [...'SayEye'].forEach((c,i)=>{ const s=document.createElement('span'); s.textContent=c; s.style.animationDelay=(0.9+i*0.07)+'s'; n.append(s); });
  const sp=$('#splash'), reduce=matchMedia('(prefers-reduced-motion:reduce)').matches, t0=performance.now();
  const hide=()=>{ sp.classList.add('done'); setTimeout(()=>sp.remove(),800); };
  addEventListener('load',()=>setTimeout(hide, Math.max(0,(reduce?300:2300)-(performance.now()-t0)))); })();
</script>
</body>
</html>
